version: '3.8'

services:
  personal-finance-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-finance-os
    restart: always
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: sqlite:////app/data/database.sqlite
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Reverse proxy trust (CloudFront ZTNA will set headers)
      API_TRUST_PROXY: "true"
    volumes:
      # SQLite database persistence
      - pfo_data:/app/data
      # Logs (optional)
      - pfo_logs:/app/logs
    networks:
      - pfo_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pfo_data:
    driver: local
  pfo_logs:
    driver: local

networks:
  pfo_network:
    driver: bridge
